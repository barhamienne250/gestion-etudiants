apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: gestion-etudiants
data:
  prometheus.yml: |
    global:
      scrape_interval: 10s
    scrape_configs:
      - job_name: 'gestion-etudiants-backend'
        metrics_path: '/actuator/prometheus'
        static_configs:
          - targets: ['backend:8080']
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']
